name: Build and Test Mininet Docker

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      run: |
        docker build -t mininet-demo .
        
    - name: Test Docker container
      run: |
        # Start container in background
        docker run -d --name mininet-test --privileged mininet-demo sleep 60
        
        # Wait for container to start
        sleep 10
        
        # Test mininet installation
        docker exec mininet-test mn --version
        
        # Test OVS
        docker exec mininet-test ovs-vsctl show
        
        # Test basic functionality
        docker exec mininet-test timeout 30 mn --test pingall
        
        # Check demo scripts exist
        docker exec mininet-test ls -la /root/demos/
        
        # Stop container
        docker stop mininet-test
        
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Push to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        docker tag mininet-demo prashplus/mininet-docker:latest
        docker push prashplus/mininet-docker:latest
